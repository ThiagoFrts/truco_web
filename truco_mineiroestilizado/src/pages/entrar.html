<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Truco Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>

<body>
    <header class="topo">
        <a class="marca" href="../../index.html">
            <span class="marca__icone" aria-hidden="true"></span>
            <span class="marca__nome">Truco Web</span>
        </a>
        <nav aria-label="Principal">
            <a href="../../index.html">Início</a>
            <a href="jogar.html">Jogar</a>
            <a href="ranking.html">Ranking</a>
            <a href="entrar.html" class="nav-entrar" aria-current="page">Entrar</a>
        </nav>
    </header>

    <main class="auth entra">
        <h1>Sente aqui</h1>
        <p class="auth__sub">Entre para guardar suas vitórias e aparecer no ranking.</p>

        <input type="radio" name="aba" id="aba-login" checked>
        <input type="radio" name="aba" id="aba-cadastro">
        <div class="auth__abas">
            <label for="aba-login">Entrar</label>
            <label for="aba-cadastro">Criar conta</label>
        </div>

        <!-- TODO: apontar o action de cada formulário para os seus arquivos PHP
             e ajustar os atributos name se o backend esperar outros nomes. -->
        <form id="form-login" method="post" action="">
            <div class="campo">
                <label for="login-usuario">Usuário ou e-mail</label>
                <input id="login-usuario" name="usuario" type="text" autocomplete="username" placeholder="seu_nome" required>
            </div>
            <div class="campo">
                <label for="login-senha">Senha</label>
                <input id="login-senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button class="btn btn--bloco" type="submit">Entrar na mesa</button>
        </form>

        <form id="form-cadastro" method="post" action="">
            <div class="campo">
                <label for="cad-usuario">Nome de usuário</label>
                <input id="cad-usuario" name="usuario" type="text" autocomplete="username" minlength="3" placeholder="seu_nome" required>
            </div>
            <div class="campo">
                <label for="cad-email">E-mail</label>
                <input id="cad-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            </div>
            <div class="campo">
                <label for="cad-senha">Senha</label>
                <input id="cad-senha" name="senha" type="password" autocomplete="new-password" minlength="6" placeholder="mínimo de 6 caracteres" required>
            </div>
            <div class="campo">
                <label for="cad-senha2">Repita a senha</label>
                <input id="cad-senha2" name="senha2" type="password" autocomplete="new-password" minlength="6" placeholder="••••••••" required>
            </div>
            <button class="btn btn--bloco" type="submit">Criar minha conta</button>
        </form>
    </main>

    <footer class="rodape">
        <span aria-hidden="true">♠ ♥ ♣ ♦</span><br>
        Truco Web — projeto didático
    </footer>
</body>

</html>
